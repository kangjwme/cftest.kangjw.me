<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflare 網路延遲測試工具</title>
  <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css'>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="theme-toggle" onclick="toggleTheme()" title="切換深色/淺色模式">
    <i class="fas fa-moon"></i>
  </div>

  <main>
    <div class="container">
      <div class="header-section">
        <h1 class="main-title">
          <i class="fas fa-cloud"></i>
          Cloudflare 網路延遲測試
        </h1>
        <p class="subtitle">測試您的網路連接到 Cloudflare 各級服務的延遲表現</p>
      </div>

      <div id="warpStatus" class="warp-status-card"></div>

      <!-- 統計卡片 -->
      <div class="stats-container" id="statsContainer">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-gauge-high"></i></div>
          <div class="stat-content">
            <div class="stat-label">平均延遲</div>
            <div class="stat-value" id="avgLatency">-- ms</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon best"><i class="fas fa-bolt"></i></div>
          <div class="stat-content">
            <div class="stat-label">最快</div>
            <div class="stat-value" id="bestLatency">-- ms</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon worst"><i class="fas fa-snail"></i></div>
          <div class="stat-content">
            <div class="stat-label">最慢</div>
            <div class="stat-value" id="worstLatency">-- ms</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
          <div class="stat-content">
            <div class="stat-label">測試站點</div>
            <div class="stat-value" id="testCount">0</div>
          </div>
        </div>
      </div>

      <!-- 進度條 -->
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">準備測試...</div>
      </div>

      <!-- 控制按鈕 -->
      <div class="controls">
        <button class="btn btn-primary btn-lg" onclick="startTest();" id="reloadButton">
          <i class="fas fa-rotate"></i> 重新測試
        </button>
        <button class="btn btn-secondary btn-lg" onclick="sortByLatency();" id="sortButton">
          <i class="fas fa-sort"></i> 按延遲排序
        </button>
      </div>

      <!-- 結果表格 -->
      <div class="table-container">
        <table id="cloudfalre_result" class="results-table">
          <thead>
            <tr>
              <th class="text-center" onclick="sortByColumn(0)">
                <i class="fas fa-layer-group"></i> 等級
              </th>
              <th class="text-center" onclick="sortByColumn(1)">
                <i class="fas fa-globe"></i> 網址
              </th>
              <th class="text-center" onclick="sortByColumn(2)">
                <i class="fas fa-location-dot"></i> 來源
              </th>
              <th class="text-center" onclick="sortByColumn(3)">
                <i class="fas fa-clock"></i> 平均延遲
              </th>
              <th class="text-center">
                <i class="fas fa-wave-square"></i> 抖動
              </th>
              <th class="text-center">
                <i class="fas fa-chart-bar"></i> 狀態
              </th>
            </tr>
          </thead>
          <tbody id="result">
            <tr><td colspan="6" class="text-center loading-cell">準備載入測試...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <p><i class="fas fa-heart"></i> 歡迎隨意使用或分享 <strong>cftest.kangjw.me</strong></p>
      <p>如果想增加您的網站到測試列表，歡迎來信 <a href="mailto:hi@kangjw.me">hi@kangjw.me</a></p>
      <p class="version">版本號 v0.2.0 <i class="fas fa-sparkles"></i></p>
    </div>
  </footer>

  <script src='./cfdetect.js'></script>
</body>
</html>
